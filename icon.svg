<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111420"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Outer circle — thin, precise, like an instrument bezel -->
  <circle cx="256" cy="240" r="155" fill="none" stroke="#2a2f40" stroke-width="1"/>

  <!-- Coordinate cross — subtle, mathematical -->
  <line x1="100" y1="240" x2="412" y2="240" stroke="#1e2230" stroke-width="0.75"/>
  <line x1="256" y1="84" x2="256" y2="396" stroke="#1e2230" stroke-width="0.75"/>

  <!-- Polar curve — the heart of flight analysis
       This is a stylized glider polar: speed (right) vs sink (down)
       The curve bows down and right, classic aerodynamic shape -->
  <path d="M 152 190 
           C 170 195, 200 202, 230 218 
           C 260 234, 290 260, 320 300 
           C 340 328, 355 358, 368 385"
        fill="none" stroke="#4f9cf7" stroke-width="3" stroke-linecap="round"/>

  <!-- Best L/D tangent from origin — the optimal glide line -->
  <line x1="256" y1="240" x2="345" y2="340" 
        stroke="#5dd39e" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6 4"/>

  <!-- MacCready tangent — shifted up from origin, steeper = fly faster -->
  <line x1="256" y1="200" x2="310" y2="290" 
        stroke="#f0884a" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="4 3"/>

  <!-- Tangent point on polar (the optimal speed point) -->
  <circle cx="293" cy="272" r="5" fill="#f0884a" opacity="0.9"/>

  <!-- Best L/D point -->
  <circle cx="310" cy="300" r="4" fill="#5dd39e" opacity="0.7"/>

  <!-- Min sink point -->
  <circle cx="205" cy="207" r="3.5" fill="#4f9cf7" opacity="0.6"/>

  <!-- Thermal spiral — a single elegant logarithmic spiral
       Represents the climb, the waiting, the patience -->
  <path d="M 165 260 
           C 155 240, 160 215, 180 210 
           C 200 205, 215 218, 210 235 
           C 205 250, 190 255, 182 245 
           C 175 236, 180 224, 190 222"
        fill="none" stroke="#f0884a" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4"/>

  <!-- Flight path — a single clean arc crossing the diagram
       The actual journey through the sky -->
  <path d="M 115 330 C 160 280, 210 235, 256 210 C 310 182, 360 185, 400 210"
        fill="none" stroke="#4f9cf7" stroke-width="1.2" stroke-opacity="0.25" stroke-linecap="round"/>

  <!-- Scale ticks — precision instrument feel -->
  <g stroke="#3a4055" stroke-width="1" stroke-linecap="round">
    <!-- Horizontal (speed axis) -->
    <line x1="296" y1="237" x2="296" y2="243"/>
    <line x1="336" y1="237" x2="336" y2="243"/>
    <line x1="376" y1="237" x2="376" y2="243"/>
    <!-- Vertical (sink axis) -->
    <line x1="253" y1="280" x2="259" y2="280"/>
    <line x1="253" y1="320" x2="259" y2="320"/>
    <line x1="253" y1="360" x2="259" y2="360"/>
  </g>

  <!-- Axis labels — tiny, precise -->
  <text x="400" y="235" font-family="sans-serif" font-size="11" fill="#3a4055" text-anchor="end">V</text>
  <text x="260" y="96" font-family="sans-serif" font-size="11" fill="#3a4055">−Vs</text>

  <!-- OXCA wordmark -->
  <text x="256" y="462" text-anchor="middle" 
        font-family="sans-serif" font-weight="300" font-size="44" 
        fill="#e8eaf0" letter-spacing="12" opacity="0.85">OXCA</text>
</svg>
